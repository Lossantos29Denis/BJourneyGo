version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Dls15032005!"
      MYSQL_DATABASE: BJourneyGo
    volumes:
      - ../mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network

  api:
    build: ../BJourneyGo-api
    container_name: bj_api
    restart: unless-stopped
    env_file:
      - ../BJourneyGo-api/api.env
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      - mysql
    networks:
      - app_network

  web:
    build: ../BJourneyGo-web
    container_name: bj_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["node", "/app/node_modules/.bin/astro", "preview", "--port", "3000", "--host"]
    environment:
      NODE_ENV: production
      API_URL: "http://api:4000"
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  uploads_data:
