<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="BJourneyGo logo">
  <rect width="256" height="256" rx="36" fill="#f97316" />
  <g transform="translate(34,46) scale(0.83)" fill="#fff">
    <!-- bus body -->
    <rect x="6" y="8" width="140" height="72" rx="10" />
    <!-- windshield strip -->
    <rect x="12" y="18" width="56" height="12" rx="3" fill="#f97316" />
    <!-- side windows -->
    <rect x="74" y="20" width="54" height="40" rx="6" />
    <!-- wheels -->
    <circle cx="36" cy="100" r="10" />
    <circle cx="110" cy="100" r="10" />
    <!-- ticket symbol on bus front -->
    <rect x="124" y="34" width="24" height="28" rx="4" fill="#f97316" />
    <rect x="130" y="42" width="12" height="12" rx="2" fill="#fff" />
